name: Build Bintan Sonar AI APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Verify or restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f app/google-services.json ] && [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Restored app/google-services.json from GitHub Secret."
          fi
          if [ ! -f app/google-services.json ]; then
            echo "::warning::app/google-services.json belum ada di repo. Tambahkan secret GOOGLE_SERVICES_JSON atau upload app/google-services.json agar Firebase Gemini AI aktif di APK."
          else
            echo "app/google-services.json ditemukan dan siap dipaketkan ke APK."
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK for easy download
        run: |
          mkdir -p apk-output
          cp app/build/outputs/apk/debug/app-debug.apk apk-output/Bintan-Sonar-AI.apk

      - name: Upload Bintan Sonar AI APK
        uses: actions/upload-artifact@v4
        with:
          name: Bintan-Sonar-AI-APK
          path: apk-output/Bintan-Sonar-AI.apk
          retention-days: 30
